[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Production-minded IEEE-CIS Fraud Detection Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xgboost==2.0.3",
    "scikit-learn==1.4.1",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "shap==0.45.0",
    "streamlit==1.32.0",
    "joblib==1.3.2",
    "mlflow==2.11.0",
    "pydantic==2.6.3"
]