# Single place for every setting. Change numbers here, never inside code.
seed: 42

data:
  raw_dir: data/raw                       # real Kaggle files go here
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  target: isFraud
  id_col: TransactionID
  time_col: TransactionDT

# Time-ordered split (Module 9: train on the past, test on the future)
split:
  train_frac: 0.70
  valid_frac: 0.15        # test = the most recent remaining 15%

features:
  drop_missing_above: 0.95      # drop columns that are >95% empty (Module 6 cleaning)
  freq_encode: [card1, card2, card3, card5, addr1, P_emaildomain, R_emaildomain, DeviceInfo, uid, uid2]
  amount_agg_by: [card1, uid, addr1, P_emaildomain]

model:
  early_stopping_rounds: 100
  logreg:
    max_train_rows: 200000      # logistic regression is only a baseline, subsample for speed
    C: 0.1
  xgb:
    n_estimators: 2000
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.6
    min_child_weight: 3
    reg_lambda: 1.0
  fast:                          # used with --fast (quick check on a laptop)
    n_estimators: 400
    learning_rate: 0.1
    max_depth: 6
  tuning:
    n_trials: 8                  # random search trials (0 disables)
    space:
      max_depth: [5, 6, 7, 8, 9, 10]
      learning_rate: [0.03, 0.05, 0.08]
      subsample: [0.7, 0.8, 0.9]
      colsample_bytree: [0.4, 0.5, 0.6, 0.8]
      min_child_weight: [1, 3, 5, 10]
      reg_lambda: [0.5, 1.0, 5.0, 10.0]

# Business assumptions used for the cost-based threshold (Module 9 and 15)
business:
  review_cost: 5.0               # cost (USD) of a human reviewing one flagged transaction
  fraud_loss_multiplier: 1.0     # money lost on a missed fraud = amount * this value

mlflow:
  enabled: true
  experiment: ieee-cis-fraud

shap:
  sample_size: 5000

drift:
  sample_size: 100000
  psi_alert: 0.25

# Sample-size planning for the production A/B test (Module 10)
ab_test:
  baseline_loss_rate: 0.035      # share of transactions that end in fraud loss today
  relative_reduction: 0.15       # we hope the model cuts that by 15%
  alpha: 0.05
  power: 0.80
  daily_transactions: 3000
